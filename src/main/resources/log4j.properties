
# priority  :debug<info<warn<error
#you cannot specify every priority with different file for log4j 
#log4j.rootLogger=debug,stdout,info,warn,error 
log4j.rootLogger=debug,log
#debug log
#log4j.logger.log=debug
log4j.appender.log=org.apache.log4j.DailyRollingFileAppender 
log4j.appender.log.DatePattern=yyyy-MM-dd-HH'.log'
log4j.appender.log.File=log/fdc_
log4j.appender.log.Encoding=UTF-8
#log4j.appender.log.Append=true
#----------------开启debug模式----------------------#
#log4j.appender.log.Threshold=DEBUG 
#--------------log 数量大 ，记录更详细--------------# 
#----------------默认开启INFO模式----------------------#
log4j.appender.log.Threshold=INFO
#---------------------------------------------------------#
log4j.appender.log.layout=org.apache.log4j.PatternLayout 
log4j.appender.log.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss } [%p] (%F:%L)  %m%n

