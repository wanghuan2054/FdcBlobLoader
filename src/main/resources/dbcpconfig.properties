# 连接池启动时创建的初始化连接数量（默认值为0）
initialSize=1
#连接池中可同时连接的最大的连接数
maxActive=20
#连接池中最大的空闲的连接数，超过的空闲连接将被释放，如果设置为负数表示不限制
maxIdle=10
#连接池中最小的空闲的连接数，低于这个数量会被创建新的连接
minIdle=5
#最大等待时间，无可用连接时，连接池等待连接释放的最大时间
#超过该时间限制会抛出异常，如果设置-1表示无限等待 
#以毫秒为单位 1分钟
maxWait=60000
#是否在自动回收超时连接的时候打印连接的超时错误  
logAbandoned=true 
#是否自动回收超时连接  
removeAbandoned=true  
#DBCP连接池自动管理应程序中使用完毕的连接
removeAbandonedOnMaintenance=true
removeAbandonedOnBorrow=true
#超时回收  以秒数为单位 3分钟
removeAbandonedTimeout=180
#driver defalut 指定由连接池所创建的连接的事务级别（TransactionIsolation）。
#可用值为下列之一：NONE,READ_UNCOMMITTED,READ_COMMITTED,REPEATABLE_READ
defaultTransactionIsolation=READ_COMMITTED
